name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run tests
        run: python -m pytest -q

      - name: Generate sample assets
        run: python scripts/generate_assets.py

      - name: End-to-end CLI smoke test
        run: |
          python -m seam_carving.cli assets/scene.png out/ci_result.png \
            --width 280 --height 200 --method dp \
            --seams-dir out/ci_steps --gif out/ci.gif
          python -c "from PIL import Image; assert Image.open('out/ci_result.png').size == (280, 200)"

      - name: Generate report figures
        run: python scripts/run_experiments.py

      - name: Build submission documents
        run: python scripts/build_documents.py

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.python-version }}
          path: |
            out/
            report/figures/
            report/report.docx
            report/results.md
            slides/seam_carving_slides.pptx
          if-no-files-found: warn
