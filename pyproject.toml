[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-carving"
version = "1.0.0"
description = "Content-aware image resizing by seam carving (DP, greedy, and graph cut)."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
docs = ["python-docx>=1.1", "python-pptx>=0.6"]

[project.scripts]
seam-carve = "seam_carving.cli:main"

[tool.setuptools.packages.find]
include = ["seam_carving*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
